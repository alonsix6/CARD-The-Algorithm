<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The Algorithm - Data & Market Intelligence by Reset & The Lab">
  <meta name="theme-color" content="#0A0A0A">

  <title>The Algorithm | Reset - Data & Market Intelligence</title>

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Atropos CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/atropos@2/atropos.min.css">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Favicon placeholder -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>A</text></svg>">
</head>
<body>
  <!-- Particles Background -->
  <div id="particles-bg"></div>

  <!-- Main Content -->
  <main class="main-container">
    <!-- Card Container with Atropos -->
    <div class="card-container">
      <div class="atropos" id="card-atropos">
        <div class="atropos-scale">
          <div class="atropos-rotate">
            <div class="atropos-inner">
              <div class="card-flipper" id="card-flipper">

                <!-- FRONT FACE - Main Content -->
                <div class="card-face card-front" data-atropos-offset="0">
                  <div class="card-content">
                    <!-- Header -->
                    <header class="card-header">
                      <h1 class="card-title" data-atropos-offset="5">THE ALGORITHM</h1>
                      <p class="card-subtitle" data-atropos-offset="3">Data & Market Intelligence</p>
                      <div class="card-divider" data-atropos-offset="2"></div>
                    </header>

                    <!-- CTA Buttons -->
                    <nav class="card-ctas" data-atropos-offset="8">
                      <a href="https://www.notion.so/2e7f63b5a985816bbe27cf3bf3218dc8"
                         class="cta-button"
                         target="_blank"
                         rel="noopener noreferrer"
                         aria-label="Leer el articulo completo sobre The Algorithm">
                        <span class="cta-icon">
                          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                          </svg>
                        </span>
                        <span class="cta-text">Leer el articulo</span>
                        <span class="cta-arrow">
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                          </svg>
                        </span>
                      </a>

                      <a href="https://diagnostico-data-reset.netlify.app/"
                         class="cta-button"
                         target="_blank"
                         rel="noopener noreferrer"
                         aria-label="Realizar el diagnostico de data de tu empresa">
                        <span class="cta-icon">
                          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="22" y1="12" x2="18" y2="12"></line>
                            <line x1="6" y1="12" x2="2" y2="12"></line>
                            <line x1="12" y1="6" x2="12" y2="2"></line>
                            <line x1="12" y1="22" x2="12" y2="18"></line>
                          </svg>
                        </span>
                        <span class="cta-text">Hacer el diagnostico</span>
                        <span class="cta-arrow">
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                          </svg>
                        </span>
                      </a>

                      <a href="https://reset-the-algorithm.netlify.app/"
                         class="cta-button"
                         target="_blank"
                         rel="noopener noreferrer"
                         aria-label="Ver la demo interactiva de The Algorithm">
                        <span class="cta-icon">
                          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                          </svg>
                        </span>
                        <span class="cta-text">Ver la demo</span>
                        <span class="cta-arrow">
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                          </svg>
                        </span>
                      </a>
                    </nav>

                    <!-- Footer -->
                    <footer class="card-footer" data-atropos-offset="2">
                      <div class="footer-divider"></div>
                      <p class="powered-by">powered by <span class="the-lab">THE LAB</span></p>
                    </footer>
                  </div>

                  <!-- Shine effect overlay -->
                  <div class="card-shine"></div>
                </div>

                <!-- BACK FACE - Logos -->
                <div class="card-face card-back" data-atropos-offset="0">
                  <div class="card-content card-back-content">
                    <!-- Reset Logo -->
                    <div class="logo-container" data-atropos-offset="5">
                      <!--
                        PLACEHOLDER: Reemplazar con logo-reset.png
                        Ubicacion: assets/logo-reset.png
                        Tamano recomendado: 120px de ancho, fondo transparente, logo en blanco
                      -->
                      <div class="logo-placeholder reset-logo">
                        <span>RESET</span>
                      </div>
                    </div>

                    <!-- Plus symbol -->
                    <div class="plus-symbol" data-atropos-offset="8">+</div>

                    <!-- Wanted Logo -->
                    <div class="logo-container" data-atropos-offset="5">
                      <!--
                        PLACEHOLDER: Reemplazar con logo-wanted.png
                        Ubicacion: assets/logo-wanted.png
                        Tamano recomendado: 120px de ancho, fondo transparente, logo en blanco
                      -->
                      <div class="logo-placeholder wanted-logo">
                        <span>WANTED</span>
                      </div>
                    </div>

                    <!-- Plus symbol -->
                    <div class="plus-symbol" data-atropos-offset="8">+</div>

                    <!-- The Lab text -->
                    <div class="thelab-container" data-atropos-offset="5">
                      <h2 class="thelab-title">THE LAB</h2>
                      <p class="thelab-subtitle">SOLUTIONS</p>
                    </div>
                  </div>

                  <!-- Shine effect overlay -->
                  <div class="card-shine"></div>
                </div>

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Flip hint -->
    <p class="flip-hint" id="flip-hint">
      <span class="flip-hint-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="1 4 1 10 7 10"></polyline>
          <polyline points="23 20 23 14 17 14"></polyline>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
        </svg>
      </span>
      Desliza para voltear
    </p>
  </main>

  <!-- Scripts -->
  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Atropos -->
  <script src="https://cdn.jsdelivr.net/npm/atropos@2/atropos.min.js"></script>

  <!-- tsParticles -->
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

  <!-- Main Script -->
  <script src="js/main.js"></script>

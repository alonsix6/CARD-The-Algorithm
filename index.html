<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The Algorithm - Data & Market Intelligence by Reset & The Lab">
  <meta name="theme-color" content="#F8F8FF">

  <title>The Algorithm | Reset - Data & Market Intelligence</title>

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwindcss.config = {
      theme: {
        extend: {
          animation: {
            flip: "flip 6s infinite steps(2, end)",
            kitrotate: "kitrotate 3s linear infinite both",
          },
          keyframes: {
            flip: { to: { transform: "rotate(360deg)" } },
            kitrotate: { to: { transform: "rotate(90deg)" } },
          },
        },
      },
    }
  </script>

  <!-- Atropos CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/atropos@2/atropos.min.css">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>A</text></svg>">
</head>
<body>
  <!-- Gradient Background -->
  <div class="gradient-bg"></div>

  <!-- Particles Background -->
  <div id="particles-bg"></div>

  <!-- Main Content -->
  <main class="main-container">
    <!-- Card Scene (provides perspective) -->
    <div class="card-scene" id="card-scene">
      <!-- Atropos wrapper -->
      <div class="atropos" id="card-atropos">
        <div class="atropos-scale">
          <div class="atropos-rotate">
            <div class="atropos-inner">

              <!-- Card Inner (this rotates for flip) -->
              <div class="card-inner" id="card-inner">

                <!-- FRONT FACE -->
                <div class="card-face card-front">
                  <div class="card-content">
                    <!-- Header -->
                    <header class="card-header" data-atropos-offset="5">
                      <h1 class="card-title">THE ALGORITHM</h1>
                      <p class="card-subtitle">Data & Market Intelligence</p>
                      <div class="card-divider"></div>
                    </header>

                    <!-- CTA Buttons with Spark Effect -->
                    <nav class="card-ctas" data-atropos-offset="10">

                      <!-- CTA 1: Leer el articulo -->
                      <a href="https://www.notion.so/2e7f63b5a985816bbe27cf3bf3218dc8"
                         target="_blank"
                         rel="noopener noreferrer"
                         aria-label="Leer el articulo completo sobre The Algorithm"
                         class="cta-spark group">
                        <span class="spark mask-gradient animate-flip before:animate-kitrotate absolute inset-0 h-full w-full overflow-hidden rounded-xl [mask:linear-gradient(white,_transparent_50%)] before:absolute before:aspect-square before:w-[200%] before:rotate-[-90deg] before:bg-[conic-gradient(from_0deg,transparent_0_340deg,#00FF85_360deg)] before:content-[''] before:[inset:0_auto_auto_50%] before:[translate:-50%_-15%]"></span>
                        <span class="backdrop absolute inset-px rounded-xl bg-[#1A1A1A] transition-colors duration-200 group-hover:bg-[#222]"></span>
                        <span class="z-10 flex items-center gap-3 text-white font-medium font-['Montserrat']">
                          <!-- Lucide: FileText icon -->
                          <svg class="w-5 h-5 text-[#00FF85]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>
                          <span class="text-sm md:text-base">Leer el articulo</span>
                        </span>
                      </a>

                      <!-- CTA 2: Hacer el diagnostico -->
                      <a href="https://diagnostico-data-reset.netlify.app/"
                         target="_blank"
                         rel="noopener noreferrer"
                         aria-label="Realizar el diagnostico de data de tu empresa"
                         class="cta-spark group">
                        <span class="spark mask-gradient animate-flip before:animate-kitrotate absolute inset-0 h-full w-full overflow-hidden rounded-xl [mask:linear-gradient(white,_transparent_50%)] before:absolute before:aspect-square before:w-[200%] before:rotate-[-90deg] before:bg-[conic-gradient(from_0deg,transparent_0_340deg,#00FF85_360deg)] before:content-[''] before:[inset:0_auto_auto_50%] before:[translate:-50%_-15%]"></span>
                        <span class="backdrop absolute inset-px rounded-xl bg-[#1A1A1A] transition-colors duration-200 group-hover:bg-[#222]"></span>
                        <span class="z-10 flex items-center gap-3 text-white font-medium font-['Montserrat']">
                          <!-- Lucide: Target icon -->
                          <svg class="w-5 h-5 text-[#00FF85]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
                          <span class="text-sm md:text-base">Hacer el diagnostico</span>
                        </span>
                      </a>

                      <!-- CTA 3: Ver la demo -->
                      <a href="https://reset-the-algorithm.netlify.app/"
                         target="_blank"
                         rel="noopener noreferrer"
                         aria-label="Ver la demo interactiva de The Algorithm"
                         class="cta-spark group">
                        <span class="spark mask-gradient animate-flip before:animate-kitrotate absolute inset-0 h-full w-full overflow-hidden rounded-xl [mask:linear-gradient(white,_transparent_50%)] before:absolute before:aspect-square before:w-[200%] before:rotate-[-90deg] before:bg-[conic-gradient(from_0deg,transparent_0_340deg,#00FF85_360deg)] before:content-[''] before:[inset:0_auto_auto_50%] before:[translate:-50%_-15%]"></span>
                        <span class="backdrop absolute inset-px rounded-xl bg-[#1A1A1A] transition-colors duration-200 group-hover:bg-[#222]"></span>
                        <span class="z-10 flex items-center gap-3 text-white font-medium font-['Montserrat']">
                          <!-- Lucide: Play icon -->
                          <svg class="w-5 h-5 text-[#00FF85]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                          <span class="text-sm md:text-base">Ver la demo</span>
                        </span>
                      </a>

                    </nav>

                    <!-- Footer -->
                    <footer class="card-footer" data-atropos-offset="3">
                      <div class="footer-divider"></div>
                      <p class="powered-by">powered by <span class="the-lab">THE LAB</span></p>
                    </footer>
                  </div>

                  <!-- Flip button - Ver creditos -->
                  <button
                    id="btn-flip-to-back"
                    type="button"
                    class="flip-btn"
                    aria-label="Ver creditos">
                    <!-- Lucide: RotateCcw icon -->
                    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    <span>Ver creditos</span>
                  </button>
                </div>

                <!-- BACK FACE -->
                <div class="card-face card-back">
                  <div class="card-content card-back-content">

                    <!-- Reset Logo -->
                    <div class="logo-container">
                      <!--
                        PLACEHOLDER: Reemplazar con logo-reset.png
                        Ubicacion: assets/logo-reset.png
                        Tamano: 100-120px ancho, fondo transparente, logo en blanco

                        Reemplazar el div con:
                        <img src="assets/logo-reset.png" alt="Reset" class="logo-img" />
                      -->
                      <div class="logo-text">RESET</div>
                    </div>

                    <!-- Plus symbol -->
                    <div class="plus-symbol">+</div>

                    <!-- Wanted Logo -->
                    <div class="logo-container">
                      <!--
                        PLACEHOLDER: Reemplazar con logo-wanted.png
                        Ubicacion: assets/logo-wanted.png
                        Tamano: 100-120px ancho, fondo transparente, logo en blanco

                        Reemplazar el div con:
                        <img src="assets/logo-wanted.png" alt="Wanted" class="logo-img" />
                      -->
                      <div class="logo-text">WANTED</div>
                    </div>

                    <!-- Plus symbol -->
                    <div class="plus-symbol">+</div>

                    <!-- The Lab text -->
                    <div class="thelab-container">
                      <h2 class="thelab-title">THE LAB</h2>
                      <p class="thelab-subtitle">SOLUTIONS</p>
                    </div>

                  </div>

                  <!-- Flip button - Volver -->
                  <button
                    id="btn-flip-to-front"
                    type="button"
                    class="flip-btn"
                    aria-label="Volver a la cara principal">
                    <!-- Lucide: RotateCw icon -->
                    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
                    <span>Volver</span>
                  </button>
                </div>

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Atropos -->
  <script src="https://cdn.jsdelivr.net/npm/atropos@2/atropos.min.js"></script>

  <!-- tsParticles -->
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

  <!-- Main Script -->
  <script src="js/main.js"></script>
</body>
</html>

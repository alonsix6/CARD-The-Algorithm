<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The Algorithm - Data & Market Intelligence by Reset & The Lab">
  <meta name="theme-color" content="#0A0A0A">

  <title>The Algorithm | Reset - Data & Market Intelligence</title>

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwindcss.config = {
      theme: {
        extend: {
          animation: {
            flip: "flip 6s infinite steps(2, end)",
            kitrotate: "kitrotate 3s linear infinite both",
          },
          keyframes: {
            flip: { to: { transform: "rotate(360deg)" } },
            kitrotate: { to: { transform: "rotate(90deg)" } },
          },
        },
      },
    }
  </script>

  <!-- Atropos CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/atropos@2/atropos.min.css">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Favicon placeholder -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>A</text></svg>">
</head>
<body class="bg-[#0A0A0A] min-h-screen overflow-x-hidden">
  <!-- Particles Background -->
  <div id="particles-bg"></div>

  <!-- Main Content -->
  <main class="main-container">
    <!-- Card Container with Atropos -->
    <div class="card-container">
      <div class="atropos" id="card-atropos">
        <div class="atropos-scale">
          <div class="atropos-rotate">
            <div class="atropos-inner">
              <div class="card-flipper" id="card-flipper">

                <!-- FRONT FACE - Main Content -->
                <div class="card-face card-front" data-atropos-offset="0">
                  <div class="card-content">
                    <!-- Header -->
                    <header class="card-header">
                      <h1 class="card-title" data-atropos-offset="5">THE ALGORITHM</h1>
                      <p class="card-subtitle" data-atropos-offset="3">Data & Market Intelligence</p>
                      <div class="card-divider" data-atropos-offset="2"></div>
                    </header>

                    <!-- CTA Buttons with Spark Effect -->
                    <nav class="card-ctas" data-atropos-offset="8">

                      <!-- CTA 1: Leer el articulo -->
                      <a href="https://www.notion.so/2e7f63b5a985816bbe27cf3bf3218dc8"
                         target="_blank"
                         rel="noopener noreferrer"
                         aria-label="Leer el articulo completo sobre The Algorithm"
                         class="group relative grid overflow-hidden rounded-xl px-5 py-4 shadow-[0_1000px_0_0_hsl(0_0%_10%)_inset] transition-colors duration-200 w-full">
                        <!-- Spark/glow effect rotating -->
                        <span class="spark mask-gradient animate-flip before:animate-kitrotate absolute inset-0 h-full w-full overflow-hidden rounded-xl [mask:linear-gradient(white,_transparent_50%)] before:absolute before:aspect-square before:w-[200%] before:rotate-[-90deg] before:bg-[conic-gradient(from_0deg,transparent_0_340deg,#00FF85_360deg)] before:content-[''] before:[inset:0_auto_auto_50%] before:[translate:-50%_-15%]"></span>
                        <!-- Background -->
                        <span class="backdrop absolute inset-px rounded-xl bg-[#1A1A1A] transition-colors duration-200 group-hover:bg-[#222]"></span>
                        <!-- Content -->
                        <span class="z-10 flex items-center gap-3 text-white font-medium font-['Montserrat']">
                          <span class="text-xl">📊</span>
                          <span class="text-sm md:text-base">Leer el articulo</span>
                        </span>
                      </a>

                      <!-- CTA 2: Hacer el diagnostico -->
                      <a href="https://diagnostico-data-reset.netlify.app/"
                         target="_blank"
                         rel="noopener noreferrer"
                         aria-label="Realizar el diagnostico de data de tu empresa"
                         class="group relative grid overflow-hidden rounded-xl px-5 py-4 shadow-[0_1000px_0_0_hsl(0_0%_10%)_inset] transition-colors duration-200 w-full">
                        <!-- Spark/glow effect rotating -->
                        <span class="spark mask-gradient animate-flip before:animate-kitrotate absolute inset-0 h-full w-full overflow-hidden rounded-xl [mask:linear-gradient(white,_transparent_50%)] before:absolute before:aspect-square before:w-[200%] before:rotate-[-90deg] before:bg-[conic-gradient(from_0deg,transparent_0_340deg,#00FF85_360deg)] before:content-[''] before:[inset:0_auto_auto_50%] before:[translate:-50%_-15%]"></span>
                        <!-- Background -->
                        <span class="backdrop absolute inset-px rounded-xl bg-[#1A1A1A] transition-colors duration-200 group-hover:bg-[#222]"></span>
                        <!-- Content -->
                        <span class="z-10 flex items-center gap-3 text-white font-medium font-['Montserrat']">
                          <span class="text-xl">🎯</span>
                          <span class="text-sm md:text-base">Hacer el diagnostico</span>
                        </span>
                      </a>

                      <!-- CTA 3: Ver la demo -->
                      <a href="https://reset-the-algorithm.netlify.app/"
                         target="_blank"
                         rel="noopener noreferrer"
                         aria-label="Ver la demo interactiva de The Algorithm"
                         class="group relative grid overflow-hidden rounded-xl px-5 py-4 shadow-[0_1000px_0_0_hsl(0_0%_10%)_inset] transition-colors duration-200 w-full">
                        <!-- Spark/glow effect rotating -->
                        <span class="spark mask-gradient animate-flip before:animate-kitrotate absolute inset-0 h-full w-full overflow-hidden rounded-xl [mask:linear-gradient(white,_transparent_50%)] before:absolute before:aspect-square before:w-[200%] before:rotate-[-90deg] before:bg-[conic-gradient(from_0deg,transparent_0_340deg,#00FF85_360deg)] before:content-[''] before:[inset:0_auto_auto_50%] before:[translate:-50%_-15%]"></span>
                        <!-- Background -->
                        <span class="backdrop absolute inset-px rounded-xl bg-[#1A1A1A] transition-colors duration-200 group-hover:bg-[#222]"></span>
                        <!-- Content -->
                        <span class="z-10 flex items-center gap-3 text-white font-medium font-['Montserrat']">
                          <span class="text-xl">🚀</span>
                          <span class="text-sm md:text-base">Ver la demo</span>
                        </span>
                      </a>

                    </nav>

                    <!-- Footer -->
                    <footer class="card-footer" data-atropos-offset="2">
                      <div class="footer-divider"></div>
                      <p class="powered-by">powered by <span class="the-lab">THE LAB</span></p>
                    </footer>
                  </div>

                  <!-- Flip button - Ver creditos -->
                  <button
                    id="btn-flip-to-back"
                    class="absolute bottom-4 right-4 text-gray-500 hover:text-[#00FF85] text-xs md:text-sm flex items-center gap-1 transition-colors duration-200 z-20"
                    aria-label="Ver creditos">
                    <span class="text-base">↻</span>
                    <span>Ver creditos</span>
                  </button>

                  <!-- Shine effect overlay -->
                  <div class="card-shine"></div>
                </div>

                <!-- BACK FACE - Logos/Credits -->
                <div class="card-face card-back" data-atropos-offset="0">
                  <div class="card-content card-back-content">

                    <!-- Reset Logo -->
                    <div class="logo-container" data-atropos-offset="5">
                      <!--
                        PLACEHOLDER: Reemplazar con logo-reset.png
                        Ubicacion: assets/logo-reset.png
                        Tamano recomendado: 100px de ancho, fondo transparente, logo en blanco

                        Reemplazar el div placeholder con:
                        <img src="assets/logo-reset.png" alt="Reset" class="w-[100px] md:w-[120px] h-auto" />
                      -->
                      <div class="text-white font-bold text-2xl md:text-3xl tracking-wider font-['Bebas_Neue']">RESET</div>
                    </div>

                    <!-- Plus symbol -->
                    <div class="plus-symbol text-[#00FF85] text-2xl md:text-3xl font-light" data-atropos-offset="8">+</div>

                    <!-- Wanted Logo -->
                    <div class="logo-container" data-atropos-offset="5">
                      <!--
                        PLACEHOLDER: Reemplazar con logo-wanted.png
                        Ubicacion: assets/logo-wanted.png
                        Tamano recomendado: 100px de ancho, fondo transparente, logo en blanco

                        Reemplazar el div placeholder con:
                        <img src="assets/logo-wanted.png" alt="Wanted" class="w-[100px] md:w-[120px] h-auto" />
                      -->
                      <div class="text-white font-bold text-2xl md:text-3xl tracking-wider font-['Bebas_Neue']">WANTED</div>
                    </div>

                    <!-- Plus symbol -->
                    <div class="plus-symbol text-[#00FF85] text-2xl md:text-3xl font-light" data-atropos-offset="8">+</div>

                    <!-- The Lab text -->
                    <div class="thelab-container text-center" data-atropos-offset="5">
                      <h2 class="text-white text-2xl md:text-[28px] tracking-[4px] font-['Bebas_Neue'] mb-0">THE LAB</h2>
                      <p class="text-[#888] text-[10px] md:text-xs tracking-[3px] uppercase font-['Montserrat'] font-medium">SOLUTIONS</p>
                    </div>

                  </div>

                  <!-- Flip button - Volver -->
                  <button
                    id="btn-flip-to-front"
                    class="absolute bottom-4 right-4 text-gray-500 hover:text-[#00FF85] text-xs md:text-sm flex items-center gap-1 transition-colors duration-200 z-20"
                    aria-label="Volver a la cara principal">
                    <span class="text-base">↻</span>
                    <span>Volver</span>
                  </button>

                  <!-- Shine effect overlay -->
                  <div class="card-shine"></div>
                </div>

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Atropos -->
  <script src="https://cdn.jsdelivr.net/npm/atropos@2/atropos.min.js"></script>

  <!-- tsParticles -->
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

  <!-- Main Script -->
  <script src="js/main.js"></script>
</body>
</html>
